version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      dependabot-patch:
        applies-to: version-updates
        update-types:
          - "patch"
      dependabot-minor:
        applies-to: version-updates
        update-types:
          - "minor"
      dependabot-major:
        applies-to: version-updates
        update-types:
          - "major"